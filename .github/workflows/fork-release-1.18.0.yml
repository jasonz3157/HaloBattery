name: Publish fork 1.18.0

on:
  push:
    branches: ['release/publish-v1.18.0']
    paths: ['.github/workflows/fork-release-1.18.0.yml']

concurrency:
  group: fork-release-1.18.0
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'jasonz3157/HaloBattery' && github.ref == 'refs/heads/release/publish-v1.18.0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: jasonz3157/HaloBattery
      SOURCE_SHA: 32b8fc5f169d3f9e62fb5fca80c8850c425d66b6
      CI_RUN_ID: '45924528594'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 32b8fc5f169d3f9e62fb5fca80c8850c425d66b6
          persist-credentials: false

      - name: Require successful CI for this exact main commit
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          url = f"https://api.github.com/repos/{os.environ['GH_REPO']}/actions/runs/{os.environ['CI_RUN_ID']}"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json"}
          for attempt in range(100):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  run = json.load(response)
              if (run["head_sha"] != os.environ["SOURCE_SHA"]
                      or run["head_branch"] != "main"
                      or run["event"] != "push"
                      or run["path"] != ".github/workflows/tests.yml"
                      or run["head_repository"]["full_name"] != os.environ["GH_REPO"]):
                  raise SystemExit("CI source does not match the approved release commit")
              if run["status"] == "completed":
                  if run["conclusion"] not in ("success", "cancelled"):
                      raise SystemExit("Release CI did not succeed")
                  jobs_url = url + "/jobs?per_page=100"
                  with urllib.request.urlopen(urllib.request.Request(jobs_url, headers=headers), timeout=30) as response:
                      jobs = json.load(response)
                  if jobs["total_count"] > 100:
                      raise SystemExit("Unexpected number of CI jobs")
                  required = {"lint", "tests", "compatibility (3.13.17)", "compatibility (3.14.10)"}
                  actual = {job["name"]: job for job in jobs["jobs"]}
                  if not required.issubset(actual):
                      raise SystemExit("Required CI jobs are missing")
                  if any(actual[name]["status"] != "completed" or actual[name]["conclusion"] != "success"
                         for name in required):
                      raise SystemExit("A required CI job did not succeed")
                  if any(job["name"] not in required and
                         not (job["name"] == "branch-policy" and job["conclusion"] == "skipped")
                         for job in jobs["jobs"]):
                      raise SystemExit("Unexpected CI job result")
                  print("Exact main commit passed every required compatibility, lint, test and packaging job")
                  break
              print("Waiting for release CI", run["status"], flush=True)
              time.sleep(15)
          else:
              raise SystemExit("Release CI did not finish in time")
          PY

      - name: Download the verified Windows build
        run: gh run download "$CI_RUN_ID" --repo "$GH_REPO" --name "HaloBattery-check-$SOURCE_SHA" --dir build-files

      - name: Prepare portable ZIP, installer and checksums
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import shutil
          import zipfile

          build = Path("build-files")
          app = build / "HaloBattery"
          setup = build / "HaloBattery-1.18.0-setup.exe"
          required = [app / "HaloBattery.exe",
                      app / "_internal/settings-ui/HaloBattery.Settings.exe", setup]
          for path in required:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty build artifact {path}")
          if any(path.is_symlink() for path in build.rglob("*")):
              raise SystemExit("Build artifact contains a symbolic link")
          output = Path("release-assets")
          output.mkdir()
          archive = output / "HaloBattery-1.18.0.zip"
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as zipped:
              for path in sorted(app.rglob("*")):
                  if path.is_file():
                      zipped.write(path, path.relative_to(build).as_posix())
          shutil.copyfile(setup, output / setup.name)
          sums = []
          for path in (archive, output / setup.name):
              digest = hashlib.file_digest(path.open("rb"), "sha256").hexdigest()
              sums.append(f"{digest} *{path.name}\n")
          (output / "SHA256SUMS.txt").write_text("".join(sums), encoding="ascii")
          manifest = {}
          for path in output.iterdir():
              with path.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              manifest[path.name] = {"size": path.stat().st_size, "digest": "sha256:" + digest}
          Path("expected-assets.json").write_text(json.dumps(manifest), encoding="utf-8")
          notes = """### Changes

          - Update to upstream Halo Battery 1.18.0.
          - Keep the fork's sleeping-device display. Only the centre device pictogram turns grey, and the battery ring retains its last known level and colour.
          - Apply the sleep display to outline, filled and custom pictograms and both ring thicknesses.

          ### Downloads

          - HaloBattery-1.18.0-setup.exe installs the application.
          - HaloBattery-1.18.0.zip contains the portable application. Extract the complete folder before running HaloBattery.exe.
          - SHA256SUMS.txt contains the SHA-256 checksums.

          The Windows executables are unsigned.

          Built from main commit 32b8fc5f169d3f9e62fb5fca80c8850c425d66b6 after successful Windows compatibility, unit, startup and packaging checks.
          """
          import textwrap
          Path("release_notes.md").write_text(textwrap.dedent(notes), encoding="utf-8")
          PY

      - name: Create the exact-commit tag and draft release
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')
          test "$current" = "$SOURCE_SHA"
          gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/v1.18.0 -f sha="$SOURCE_SHA"
          gh release create v1.18.0 --repo "$GH_REPO" --verify-tag --draft --title v1.18.0 --notes-file release_notes.md
          gh release upload v1.18.0 release-assets/HaloBattery-1.18.0.zip release-assets/HaloBattery-1.18.0-setup.exe release-assets/SHA256SUMS.txt --repo "$GH_REPO"

      - name: Verify uploaded asset digests before publication
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json"}
          base = "https://api.github.com/repos/" + os.environ["GH_REPO"]
          def fetch(path):
              with urllib.request.urlopen(urllib.request.Request(base + path, headers=headers), timeout=30) as response:
                  return json.load(response)
          release = fetch("/releases/tags/v1.18.0")
          if not release["draft"] or release["prerelease"]:
              raise SystemExit("Expected a new stable draft release")
          if fetch("/git/ref/tags/v1.18.0")["object"]["sha"] != os.environ["SOURCE_SHA"]:
              raise SystemExit("Release tag points to the wrong commit")
          expected = json.loads(Path("expected-assets.json").read_text(encoding="utf-8"))
          actual = {asset["name"]: asset for asset in release["assets"]}
          if set(actual) != set(expected):
              raise SystemExit("Release assets do not match the expected file set")
          for name, proof in expected.items():
              asset = actual[name]
              if (asset["state"] != "uploaded" or asset["size"] != proof["size"]
                      or asset["digest"] != proof["digest"]):
                  raise SystemExit("Uploaded file verification failed for " + name)
          print("All three uploaded assets match their local SHA-256 digests")
          PY

      - name: Publish as the latest release
        run: |
          gh release edit v1.18.0 --repo "$GH_REPO" --draft=false --latest
          gh release view v1.18.0 --repo "$GH_REPO" --json tagName,isDraft,isPrerelease,url
