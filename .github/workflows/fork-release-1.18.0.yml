name: Publish fork 1.18.0

on:
  push:
    branches: ['release/publish-v1.18.0']
    paths: ['.github/workflows/fork-release-1.18.0.yml']

concurrency:
  group: fork-release-1.18.0
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'jasonz3157/HaloBattery' && github.ref == 'refs/heads/release/publish-v1.18.0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: jasonz3157/HaloBattery
      SOURCE_SHA: 32b8fc5f169d3f9e62fb5fca80c8850c425d66b6
      CI_RUN_ID: '45924528594'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 32b8fc5f169d3f9e62fb5fca80c8850c425d66b6
          persist-credentials: false

      - name: Require successful CI for this exact main commit
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          url = f"https://api.github.com/repos/{os.environ['GH_REPO']}/actions/runs/{os.environ['CI_RUN_ID']}"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json"}
          for attempt in range(100):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  run = json.load(response)
              if (run["head_sha"] != os.environ["SOURCE_SHA"]
                      or run["head_branch"] != "main"
                      or run["event"] != "push"
                      or run["path"] != ".github/workflows/tests.yml"
                      or run["head_repository"]["full_name"] != os.environ["GH_REPO"]):
                  raise SystemExit("CI source does not match the approved release commit")
              if run["status"] == "completed":
                  if run["conclusion"] not in ("success", "cancelled"):
                      raise SystemExit("Release CI did not succeed")
                  jobs_url = url + "/jobs?per_page=100"
                  with urllib.request.urlopen(urllib.request.Request(jobs_url, headers=headers), timeout=30) as response:
                      jobs = json.load(response)
                  if jobs["total_count"] > 100:
                      raise SystemExit("Unexpected number of CI jobs")
                  required = {"lint", "tests", "compatibility (3.13.17)", "compatibility (3.14.10)"}
                  actual = {job["name"]: job for job in jobs["jobs"]}
                  if not required.issubset(actual):
                      raise SystemExit("Required CI jobs are missing")
                  if any(actual[name]["status"] != "completed" or actual[name]["conclusion"] != "success"
                         for name in required):
                      raise SystemExit("A required CI job did not succeed")
                  if any(job["name"] not in required and
                         not (job["name"] == "branch-policy" and job["conclusion"] == "skipped")
                         for job in jobs["jobs"]):
                      raise SystemExit("Unexpected CI job result")
                  print("Exact main commit passed every required compatibility, lint, test and packaging job")
                  break
              print("Waiting for release CI", run["status"], flush=True)
              time.sleep(15)
          else:
              raise SystemExit("Release CI did not finish in time")
          PY

      - name: Download the existing draft assets for verification
        run: gh release download v1.18.0 --repo "$GH_REPO" --dir downloaded-assets

      - name: Verify draft source, downloaded files and checksums
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request
          import zipfile

          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json"}
          base = "https://api.github.com/repos/" + os.environ["GH_REPO"]
          def fetch(path):
              with urllib.request.urlopen(urllib.request.Request(base + path, headers=headers), timeout=30) as response:
                  return json.load(response)
          release = fetch("/releases/460082056")
          if release["tag_name"] != "v1.18.0" or not release["draft"] or release["prerelease"]:
              raise SystemExit("Expected the existing v1.18.0 stable draft")
          if fetch("/git/ref/tags/v1.18.0")["object"]["sha"] != os.environ["SOURCE_SHA"]:
              raise SystemExit("Release tag points to the wrong commit")
          names = {"HaloBattery-1.18.0.zip", "HaloBattery-1.18.0-setup.exe", "SHA256SUMS.txt"}
          actual = {asset["name"]: asset for asset in release["assets"]}
          if set(actual) != names:
              raise SystemExit("Unexpected draft asset set")
          root = Path("downloaded-assets")
          if {path.name for path in root.iterdir()} != names:
              raise SystemExit("Unexpected downloaded files")
          digests = {}
          for name in names:
              path = root / name
              with path.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              asset = actual[name]
              if (asset["state"] != "uploaded" or asset["size"] != path.stat().st_size
                      or asset["digest"] != "sha256:" + digest):
                  raise SystemExit("Uploaded asset digest mismatch for " + name)
              digests[name] = digest
          checksums = {}
          for line in (root / "SHA256SUMS.txt").read_text(encoding="ascii").splitlines():
              digest, name = line.split(" *", 1)
              if name in checksums:
                  raise SystemExit("Duplicate checksum entry")
              checksums[name] = digest
          if checksums != {name: digests[name] for name in names if name != "SHA256SUMS.txt"}:
              raise SystemExit("Release checksums do not match the installer and portable ZIP")
          with zipfile.ZipFile(root / "HaloBattery-1.18.0.zip") as archive:
              required = {"HaloBattery/HaloBattery.exe",
                          "HaloBattery/_internal/settings-ui/HaloBattery.Settings.exe",
                          "HaloBattery/_internal/halo/build-info.json"}
              if not required.issubset(archive.namelist()):
                  raise SystemExit("Portable ZIP is incomplete")
              metadata = json.loads(archive.read("HaloBattery/_internal/halo/build-info.json"))
              if metadata != {"schema": 1, "channel": "stable", "version": "1.18.0"}:
                  raise SystemExit("Portable ZIP has unexpected version or channel metadata")
          print("Verified all three draft assets, checksums and portable application metadata")
          PY

      - name: Publish the verified draft as the latest release
        run: |
          gh api --method PATCH "repos/$GH_REPO/releases/460082056" -F draft=false -f make_latest=true --jq '{tag: .tag_name, draft: .draft, url: .html_url}'
